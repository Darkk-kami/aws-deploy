name: Semantic release
description: Run semantic-release and expose the calculated version during dry runs.

inputs:
  dry-run:
    description: Run semantic-release without creating a release.
    required: false
    default: "false"

outputs:
  next_version:
    description: The version calculated by semantic-release in dry-run mode.
    value: ${{ steps.release.outputs.next_version }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24"

    - name: Run semantic-release
      id: release
      shell: bash
      env:
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail

        args=(
          --package semantic-release@25.0.3
          --package conventional-changelog-conventionalcommits@8.0.0
          --package @semantic-release/changelog
          --package @semantic-release/git
          semantic-release
        )
        if [[ "${DRY_RUN}" == "true" ]]; then
          args+=(--dry-run)
          if ! output="$(npx --yes "${args[@]}" 2>&1)"; then
            printf '%s\n' "${output}" >&2
            exit 1
          fi
          printf '%s\n' "${output}"

          version="$(
            printf '%s\n' "${output}" |
              sed -nE 's/.*[Tt]he next release version is ([^[:space:]]+).*/\1/p' |
              tail -n 1
          )"
          echo "next_version=${version}" >> "${GITHUB_OUTPUT}"
        else
          npx --yes "${args[@]}"
        fi
